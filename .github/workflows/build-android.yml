name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Single Qt install for Android - automatically installs host tools too
      # and sets QT_ROOT_DIR, QT_HOST_PATH, Qt6_DIR env vars
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtcharts'
          cache: true

      - name: Install NDK and Ninja
        run: |
          sudo apt-get install -y ninja-build
          NDK="27.2.12479018"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK}" >> $GITHUB_ENV

      - name: Debug Qt paths
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "QT_HOST_PATH=$QT_HOST_PATH"
          echo "Qt6_DIR=$Qt6_DIR"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          ls "$QT_ROOT_DIR/lib/cmake/Qt6" 2>/dev/null | head -5 || echo "Qt6 cmake dir not at expected path"

      - name: Configure CMake
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -GNinja

      - name: Build
        run: cmake --build build-android --parallel $(nproc)

      - name: Package APK
        run: cmake --build build-android --target apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-${{ github.sha }}
          path: build-android/**/*.apk
          if-no-files-found: warn
          retention-days: 30
