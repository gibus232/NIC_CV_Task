name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  QT_VERSION: '6.7.2'
  QT_DIR: ${{ github.workspace }}/Qt

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build cmake

      - name: Install Qt (Linux host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          dir: ${{ env.QT_DIR }}
          cache: true
          set-env: false

      - name: Install Qt (Android arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtcharts
          dir: ${{ env.QT_DIR }}
          cache: true
          set-env: false

      - name: Install Android NDK
        run: |
          NDK_VERSION="27.2.12479018"
          echo "Installing NDK $NDK_VERSION..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}" --channel=0
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Set Qt paths
        run: |
          HOST_QT=${{ env.QT_DIR }}/${{ env.QT_VERSION }}/gcc_64
          ANDROID_QT=${{ env.QT_DIR }}/${{ env.QT_VERSION }}/android_arm64_v8a
          echo "QT_HOST_QT=$HOST_QT" >> $GITHUB_ENV
          echo "QT_ANDROID_QT=$ANDROID_QT" >> $GITHUB_ENV
          echo "Host Qt:    $HOST_QT"
          echo "Android Qt: $ANDROID_QT"
          ls "$HOST_QT" || echo "WARNING: Host Qt not found at $HOST_QT"
          ls "$ANDROID_QT" || echo "WARNING: Android Qt not found at $ANDROID_QT"

      - name: Configure CMake
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ANDROID_QT" \
            -DQT_HOST_PATH="$QT_HOST_QT" \
            -DQT_HOST_PATH_CMAKE_DIR="$QT_HOST_QT/lib/cmake" \
            -GNinja

      - name: Build
        run: cmake --build build-android --parallel $(nproc)

      - name: Package APK
        run: cmake --build build-android --target apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-${{ github.sha }}
          path: build-android/**/*.apk
          if-no-files-found: warn
          retention-days: 30
