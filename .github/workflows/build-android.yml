name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Qt for Android (arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtcharts'
          cache: true

      - name: Install Qt for Linux host
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtcharts'
          cache: true
          set-env: false
          dir: '${{ github.workspace }}/qt_host'

      - name: Set up Ninja
        run: sudo apt-get install -y ninja-build

      - name: Configure CMake for Android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$Qt6_DIR \
            -DQT_HOST_PATH=${{ github.workspace }}/qt_host/Qt/6.7.2/gcc_64 \
            -GNinja

      - name: Build
        run: cmake --build build-android --parallel

      - name: Create APK
        run: cmake --build build-android --target apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-debug-${{ github.sha }}
          path: |
            build-android/**/*.apk
          if-no-files-found: warn
          retention-days: 30
