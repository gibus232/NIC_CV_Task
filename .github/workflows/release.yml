name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtcharts'
          cache: true

      - name: Install NDK and Ninja
        run: |
          sudo apt-get install -y ninja-build
          NDK="27.2.12479018"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK}" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build-release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_STL=c++_shared \
            -GNinja

      - name: Build
        run: |
          cmake --build build-release --parallel $(nproc)
          cmake --build build-release --target apk

      - name: Collect APK
        run: |
          APK=$(find build-release -name '*.apk' | head -1)
          cp "$APK" FamilyBudget-${{ steps.version.outputs.VERSION }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Family Budget v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📱 Семейный Бюджет v${{ steps.version.outputs.VERSION }}
            **Требования:** Android 7.0+ (API 24)
          files: FamilyBudget-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
