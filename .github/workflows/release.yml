name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtcharts qtsvg'
          cache: true

      - name: Install Qt host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtcharts qtsvg'
          cache: true
          set-env: false
          dir: '${{ github.workspace }}/qt_host'

      - name: Set up CMake & Ninja
        run: |
          sudo apt-get install -y ninja-build
          pip install cmake --upgrade

      - name: Configure (Release)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cmake -B build-release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$Qt6_DIR \
            -DQT_HOST_PATH=${{ github.workspace }}/qt_host/Qt/6.7.2/gcc_64 \
            -DCMAKE_ANDROID_STL_TYPE=c++_shared \
            -GNinja

      - name: Build release APK
        run: |
          cmake --build build-release --parallel
          cmake --build build-release --target apk

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find build-release -name '*.apk' | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
          cp "$APK" FamilyBudget-${{ steps.version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Family Budget v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📱 Семейный Бюджет v${{ steps.version.outputs.VERSION }}

            ### Что нового
            - 👨‍👩‍👧‍👦 Несколько аккаунтов для членов семьи
            - 🔒 PIN-защита аккаунтов
            - 💰 Контроль доходов и расходов
            - 📈 Отчёты с диаграммами
            - 📅 Бюджетирование по категориям
            - 🎨 Стиль Frutiger Aero (2010-2016)

            ### Установка
            1. Скачайте APK
            2. Разрешите установку из неизвестных источников (в настройках андроида)
            3. Установите

            **Требования:** Android 7.0+ (API 24)
          files: FamilyBudget-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
